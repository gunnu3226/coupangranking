<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 상품 파서</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .info-box ol {
            margin-left: 20px;
            color: #555;
        }

        .info-box ol li {
            margin: 5px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="button"] {
            background: #e0e0e0;
            color: #333;
            padding: 15px 30px;
        }

        button[type="button"]:hover {
            background: #d0d0d0;
        }

        .char-count {
            text-align: right;
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

    </style>
</head>
<body>
<div class="container">
    <h1>🛒 쿠팡 상품 파서</h1>
    <p class="subtitle">쿠팡 검색 페이지의 HTML을 붙여넣거나 파일을 업로드하면 상품 정보를 자동으로 추출합니다</p>

    <div class="info-box">
        <h3>📝 사용 방법</h3>
        <ol>
            <li>쿠팡 검색 페이지로 이동합니다</li>
            <li>페이지에서 마우스 우클릭 → "검사" 클릭  -> 오른쪽 개발자 도구에서 상단 요소 클릭</li>
            <li>HTML에 오론쪽 마우스 우클릭 -> 복사 -> 요소복사</li>
            <li>텍스트 입력에 붙여넣기</li>
            <li>"파싱 시작" 버튼을 클릭합니다</li>
        </ol>
    </div>

    <div>
        <!-- 텍스트 입력 섹션 -->
        <div id="pageInputs">
            <div class="form-group page-input-group" data-page="1">
                <label>페이지 1 HTML:</label>
                <textarea
                        placeholder="여기에 쿠팡 검색 페이지의 HTML 전체를 붙여넣으세요..."
                        oninput="updateCharCount()"></textarea>
                <div class="char-count">0 characters</div>
            </div>
        </div>
        <button type="button" onclick="addPageInput()" style="background: #28a745; color: white; margin-bottom: 20px;">
            ➕ 페이지 추가
        </button>

        <div class="button-group">
            <button type="button" onclick="clearAll()">초기화</button>
            <button type="button" onclick="submitPages()">파싱 시작</button>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <a href="/saved-data" style="display: inline-block; padding: 15px 30px; background: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s;">
            📊 저장된 데이터 보기
        </a>
    </div>
</div>

<script>
    let pageCount = 1;

    function addPageInput() {
        pageCount++;
        const pageInputs = document.getElementById('pageInputs');
        const newPageDiv = document.createElement('div');
        newPageDiv.className = 'form-group page-input-group';
        newPageDiv.setAttribute('data-page', pageCount);
        newPageDiv.innerHTML = `
            <label>페이지 ${pageCount} HTML:</label>
            <textarea
                name="htmlPages"
                placeholder="여기에 쿠팡 검색 페이지의 HTML 전체를 붙여넣으세요..."
                oninput="updateCharCount()"></textarea>
            <div class="char-count">0 characters</div>
            <button type="button" onclick="removePage(this)" style="background: #dc3545; color: white; margin-top: 10px; padding: 10px 20px;">
                ❌ 페이지 ${pageCount} 제거
            </button>
        `;
        pageInputs.appendChild(newPageDiv);
    }

    function removePage(button) {
        const pageGroup = button.closest('.page-input-group');
        pageGroup.remove();
        // 페이지 번호 재정렬
        const allPages = document.querySelectorAll('.page-input-group');
        allPages.forEach((page, index) => {
            const pageNum = index + 1;
            page.setAttribute('data-page', pageNum);
            page.querySelector('label').textContent = `페이지 ${pageNum} HTML:`;
            const removeBtn = page.querySelector('button[onclick*="removePage"]');
            if (removeBtn) {
                removeBtn.textContent = `❌ 페이지 ${pageNum} 제거`;
            }
        });
        pageCount = allPages.length;
    }

    function updateCharCount() {
        const allTextareas = document.querySelectorAll('.page-input-group textarea');
        allTextareas.forEach(textarea => {
            const charCountDiv = textarea.nextElementSibling;
            const length = textarea.value.length;
            charCountDiv.textContent = length.toLocaleString() + ' characters';
        });
    }

    function validateForm() {
        const textareas = document.querySelectorAll('.page-input-group textarea');
        let hasContent = false;

        textareas.forEach(textarea => {
            if (textarea.value.trim() !== '') {
                hasContent = true;
            }
        });

        if (!hasContent) {
            alert('최소 1개 페이지의 HTML을 입력해주세요.');
            return false;
        }

        return true;
    }

    function clearAll() {
        if (confirm('입력된 내용을 모두 지우시겠습니까?')) {
            // 페이지 입력 초기화 (첫 페이지만 남김)
            const pageInputs = document.getElementById('pageInputs');
            pageInputs.innerHTML = `
                <div class="form-group page-input-group" data-page="1">
                    <label>페이지 1 HTML:</label>
                    <textarea
                            placeholder="여기에 쿠팡 검색 페이지의 HTML 전체를 붙여넣으세요..."
                            oninput="updateCharCount()"></textarea>
                    <div class="char-count">0 characters</div>
                </div>
            `;
            pageCount = 1;
        }
    }

    function submitPages() {
        const textareas = document.querySelectorAll('.page-input-group textarea');
        const htmlPages = [];

        textareas.forEach(textarea => {
            if (textarea.value.trim() !== '') {
                htmlPages.push(textarea.value);
            }
        });

        if (htmlPages.length === 0) {
            alert('최소 1개 페이지의 HTML을 입력해주세요.');
            return;
        }

        // JSON 배열로 전송
        fetch('/parse', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(htmlPages)
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                return response.text().then(text => {
                    document.open();
                    document.write(text);
                    document.close();
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('파싱 중 오류가 발생했습니다.');
        });
    }
</script>
</body>
</html>
