<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 상품 파서</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .info-box ol {
            margin-left: 20px;
            color: #555;
        }

        .info-box ol li {
            margin: 5px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="button"] {
            background: #e0e0e0;
            color: #333;
            padding: 15px 30px;
        }

        button[type="button"]:hover {
            background: #d0d0d0;
        }

        .char-count {
            text-align: right;
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .input-method {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .method-tab {
            padding: 15px 30px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .method-tab:hover {
            color: #667eea;
        }

        .method-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .input-section {
            display: none;
        }

        .input-section.active {
            display: block;
        }

        .file-upload {
            width: 100%;
            padding: 40px;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-label {
            cursor: pointer;
        }

        .file-upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .file-info {
            margin-top: 15px;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛒 쿠팡 상품 파서</h1>
    <p class="subtitle">쿠팡 검색 페이지의 HTML을 붙여넣거나 파일을 업로드하면 상품 정보를 자동으로 추출합니다</p>

    <div class="info-box">
        <h3>📝 사용 방법</h3>
        <ol>
            <li>쿠팡 검색 페이지로 이동합니다</li>
            <li>페이지에서 마우스 우클릭 → "검사" 클릭  -> 오른쪽 개발자 도구에서 상단 요소 클릭</li>
            <li>HTML에 오론쪽 마우스 우클릭 -> 복사 -> 요소복사</li>
            <li>텍스트 입력에 붙여넣기</li>
            <li>"파싱 시작" 버튼을 클릭합니다</li>
        </ol>
    </div>

    <form action="/parse" method="post" enctype="multipart/form-data">
        <div class="input-method">
            <button type="button" class="method-tab active" onclick="switchMethod('text')">📝 텍스트 입력</button>
            <button type="button" class="method-tab" onclick="switchMethod('file')">📁 파일 업로드</button>
        </div>

        <!-- 텍스트 입력 섹션 -->
        <div id="text-section" class="input-section active">
            <div class="form-group">
                <label for="htmlText">HTML 입력:</label>
                <textarea
                        id="htmlText"
                        name="htmlText"
                        placeholder="여기에 쿠팡 검색 페이지의 HTML 전체를 붙여넣으세요..."
                        oninput="updateCharCount()"></textarea>
                <div class="char-count" id="charCount">0 characters</div>
            </div>
        </div>

        <!-- 파일 업로드 섹션 -->
        <div id="file-section" class="input-section">
            <div class="form-group">
                <label>HTML 파일 선택:</label>
                <div class="file-upload">
                    <label for="htmlFile" class="file-upload-label">
                        <div class="file-upload-icon">📄</div>
                        <div>클릭하여 HTML 파일 선택</div>
                        <div style="color: #999; font-size: 0.9rem; margin-top: 5px;">또는 여기에 파일을 드래그하세요</div>
                    </label>
                    <input type="file" id="htmlFile" name="htmlFile" accept=".html,.htm" onchange="updateFileName()">
                    <div id="fileInfo" class="file-info"></div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button type="button" onclick="clearAll()">초기화</button>
            <button type="submit">파싱 시작</button>
        </div>
    </form>

    <div style="margin-top: 30px; text-align: center;">
        <a href="/saved-data" style="display: inline-block; padding: 15px 30px; background: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s;">
            📊 저장된 데이터 보기
        </a>
    </div>
</div>

<script>
    function switchMethod(method) {
        // 모든 탭과 섹션 비활성화
        document.querySelectorAll('.method-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.input-section').forEach(section => section.classList.remove('active'));

        // 선택한 탭과 섹션 활성화
        if (method === 'text') {
            document.querySelector('.method-tab:nth-child(1)').classList.add('active');
            document.getElementById('text-section').classList.add('active');
        } else {
            document.querySelector('.method-tab:nth-child(2)').classList.add('active');
            document.getElementById('file-section').classList.add('active');
        }
    }

    function updateCharCount() {
        const textarea = document.getElementById('htmlText');
        const charCount = document.getElementById('charCount');
        const length = textarea.value.length;
        charCount.textContent = length.toLocaleString() + ' characters';
    }

    function updateFileName() {
        const fileInput = document.getElementById('htmlFile');
        const fileInfo = document.getElementById('fileInfo');

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.textContent = `선택된 파일: ${file.name} (${sizeInMB} MB)`;
        } else {
            fileInfo.textContent = '';
        }
    }

    function clearAll() {
        if (confirm('입력된 내용을 모두 지우시겠습니까?')) {
            document.getElementById('htmlText').value = '';
            document.getElementById('htmlFile').value = '';
            document.getElementById('fileInfo').textContent = '';
            updateCharCount();
        }
    }

    // 드래그 앤 드롭 지원
    const fileUpload = document.querySelector('.file-upload');
    const fileInput = document.getElementById('htmlFile');

    fileUpload.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUpload.style.borderColor = '#667eea';
        fileUpload.style.background = '#f0f4ff';
    });

    fileUpload.addEventListener('dragleave', () => {
        fileUpload.style.borderColor = '#e0e0e0';
        fileUpload.style.background = '#f8f9fa';
    });

    fileUpload.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUpload.style.borderColor = '#e0e0e0';
        fileUpload.style.background = '#f8f9fa';

        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        }
    });
</script>
</body>
</html>
