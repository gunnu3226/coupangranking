plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'gunnu'
version = '0.0.1-SNAPSHOT'
description = 'coupang'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file('FE')
def frontendBuildDir = file('src/main/resources/static')
def npmBinaryName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

def resolveNpmExecutable = {
    List<File> candidates = []
    String explicitNpm = System.getenv('NPM_EXECUTABLE')
    if (explicitNpm) {
        candidates.add(file(explicitNpm))
    }

    String nvmBin = System.getenv('NVM_BIN')
    if (nvmBin) {
        candidates.add(file("${nvmBin}/${npmBinaryName}"))
    }

    String path = System.getenv('PATH') ?: ''
    path.split(File.pathSeparator)
            .findAll { it }
            .each { candidates.add(file("${it}/${npmBinaryName}")) }

    File nvmVersionsDir = file("${System.getProperty('user.home')}/.nvm/versions/node")
    if (nvmVersionsDir.exists()) {
        nvmVersionsDir.listFiles()
                ?.findAll { it.isDirectory() }
                ?.sort { a, b -> b.name <=> a.name }
                ?.each { candidates.add(file("${it.absolutePath}/bin/${npmBinaryName}")) }
    }

    candidates.add(file("/opt/homebrew/bin/${npmBinaryName}"))
    candidates.add(file("/usr/local/bin/${npmBinaryName}"))

    File npmExecutable = candidates.find { it.exists() && it.canExecute() }
    if (npmExecutable == null) {
        throw new GradleException("npm executable not found. Install Node.js/npm or set NPM_EXECUTABLE=/absolute/path/to/npm.")
    }
    return npmExecutable.absolutePath
}

tasks.register('npmInstall', Exec) {
    workingDir frontendDir
    doFirst {
        commandLine resolveNpmExecutable(), 'install'
    }
    inputs.file file('FE/package.json')
    outputs.dir file('FE/node_modules')
}

tasks.register('npmBuild', Exec) {
    dependsOn 'npmInstall'
    workingDir frontendDir
    doFirst {
        commandLine resolveNpmExecutable(), 'run', 'build'
    }
    inputs.files file('FE/package.json'), file('FE/index.html'), file('FE/vite.config.js')
    inputs.dir file('FE/src')
    outputs.dir frontendBuildDir
}

tasks.named('processResources') {
    dependsOn 'npmBuild'
}

tasks.named('clean') {
    delete frontendBuildDir
}
